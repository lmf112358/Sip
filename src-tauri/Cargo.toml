[package]
name = "sip"
version = "1.4.5"
description = "小满 Sip - 喝水 / 眼保健操 / 提肛 / 摸鱼 多任务定时提醒"
authors = ["Li Mingfeng"]
edition = "2021"

[lib]
name = "sip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须开这个特性：不开的话页面 URL 会解析成 devUrl（http://localhost:1420），
# 打包后的 exe 在没有 dev server 的机器上会打开一个空白窗口 —— 提醒页加载失败，
# 倒计时不跑、也不自动关闭，表现就是「全屏提醒卡死、其它提醒全被压住」。
# `tauri build` 会自动带上它；手动 `cargo build --release --features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# 单实例：双开会导致两套调度器（双份弹窗 / 两个托盘）和两个进程写同一个 sqlite
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
