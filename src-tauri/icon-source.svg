<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202B"/>
      <stop offset="1" stop-color="#080C11"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- 外圈：计时环 -->
  <circle cx="512" cy="512" r="316" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="34"/>
  <path d="M 512 196 A 316 316 0 0 1 828 512" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>

  <!-- 水滴 -->
  <g filter="url(#glow)">
    <path d="M512 300
             C 620 430, 692 512, 692 596
             a 180 180 0 0 1 -360 0
             C 332 512, 404 430, 512 300 Z"
          fill="url(#drop)"/>
  </g>
  <path d="M512 356
           C 596 458, 652 524, 652 592
           a 140 140 0 0 1 -280 0
           C 372 524, 428 458, 512 356 Z"
        fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- 高光 -->
  <ellipse cx="444" cy="560" rx="46" ry="62" fill="#FFFFFF" fill-opacity="0.42" transform="rotate(-18 444 560)"/>
</svg>
