<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消息</title>
    <!-- 页面级兜底日志：release 下 WebView 控制台看不见，见 reminder.html 同款说明 -->
    <script>
      (function () {
        var send = function (m) {
          try {
            var i = window.__TAURI_INTERNALS__;
            if (i && i.invoke) i.invoke("diag", { msg: "toast-html " + m });
          } catch (e) {}
        };
        send("boot href=" + location.href);
        window.addEventListener(
          "error",
          function (ev) {
            var t = ev.target;
            if (t && t.tagName && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              send("RESOURCE FAIL <" + t.tagName.toLowerCase() + "> " + (t.src || t.href || ""));
              return;
            }
            send(
              "ERROR " + (ev.message || "") + " @" + (ev.filename || "?") + ":" + (ev.lineno || 0)
            );
          },
          true
        );
        window.addEventListener("unhandledrejection", function (ev) {
          var r = ev.reason;
          send("REJECT " + ((r && (r.stack || r.message)) || String(r)));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          var n = root ? root.childElementCount : -1;
          send("root children=" + n + (n > 0 ? " ok" : " EMPTY"));
        }, 2000);
      })();
    </script>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("sip.appearance") || localStorage.getItem("ticker.appearance") || "{}");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark =
            p.theme === "dark" || ((!p.theme || p.theme === "system") && sysDark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/toast-entry.tsx"></script>
  </body>
</html>
